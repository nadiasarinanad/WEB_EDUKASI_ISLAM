<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Ustadz | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Poppins', sans-serif; }
        .form-card { background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .form-header { background: linear-gradient(135deg, #1e3d1a 0%, #2d5a27 100%); padding: 20px; color: white; }
        .form-body { padding: 30px; }
        .btn-submit { background: #2d5a27; border: none; border-radius: 50px; padding: 10px 25px; font-weight: 600; }
        .btn-submit:hover { background: #1e3d1a; transform: translateY(-2px); }
    </style>
    <!-- CSS untuk tabel Quill -->
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
    /* Style untuk tabel di editor */
    .ql-editor table {
        border-collapse: collapse;
        width: 100%;
        margin: 15px 0;
    }
    .ql-editor td, .ql-editor th {
        border: 1px solid #c8e6c9;
        padding: 8px 12px;
        vertical-align: top;
    }
    .ql-editor th {
        background-color: #e8f5e9;
        font-weight: 600;
    }
    .ql-editor tr:nth-child(even) {
        background-color: #f9fbf9;
    }
</style>
</head>
<!-- Plugin tabel untuk Quill -->
<script src="https://cdn.jsdelivr.net/npm/quill-table-ui@1.0.8/dist/quill-table-ui.js"></script>
<link href="https://cdn.jsdelivr.net/npm/quill-table-ui@1.0.8/dist/quill-table-ui.css" rel="stylesheet">
<body>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="form-card">
                    <div class="form-header">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i> Tambah Ustadz Baru</h4>
                    </div>
                    <div class="form-body">
                        <form method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
                                    <input type="text" name="nama_ustadz" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Spesialisasi <span class="text-danger">*</span></label>
                                    <input type="text" name="spesialisasi" class="form-control" placeholder="Fikih, Akidah Akhlak, dll." required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Pendidikan</label>
                                <input type="text" name="pendidikan" class="form-control" placeholder="S1, S2, Pesantren..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Biografi Singkat</label>
                                <textarea name="bio" class="form-control" rows="3" placeholder="Keahlian, pengalaman, dll."></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                    <input type="email" name="email" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <a href="/admin/dashboard" class="btn btn-secondary rounded-pill px-4">Batal</a>
                                <button type="submit" class="btn btn-submit text-white"><i class="fas fa-save me-2"></i> Simpan Ustadz</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
