<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ustadz | Ruang Jemaah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #eef5ea 0%, #daeed4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* Background ornament */
        body::before {
            content: "☪";
            font-size: 22rem;
            position: absolute;
            bottom: -80px;
            left: -80px;
            opacity: 0.08;
            font-family: serif;
            transform: rotate(-15deg);
            pointer-events: none;
        }
        body::after {
            content: "🕌";
            font-size: 16rem;
            position: absolute;
            top: -60px;
            right: -60px;
            opacity: 0.06;
            pointer-events: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            transition: transform 0.3s ease;
            border: 1px solid rgba(60, 128, 53, 0.2);
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .login-header {
            background: linear-gradient(115deg, #1e3d1a 0%, #3e8035 100%);
            padding: 2rem 1.5rem;
            text-align: center;
            color: white;
        }
        .login-header i {
            font-size: 3.5rem;
            background: rgba(255,255,255,0.15);
            padding: 1rem;
            border-radius: 60px;
            margin-bottom: 1rem;
        }
        .login-header h3 {
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .login-header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-bottom: 0;
        }
        .login-body {
            padding: 2rem 2rem 2.2rem;
        }
        .form-floating {
            margin-bottom: 1.2rem;
        }
        .form-control {
            border-radius: 60px;
            border: 1.5px solid #e0f0dc;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #2d6a2d;
            box-shadow: 0 0 0 3px rgba(45,106,45,0.1);
        }
        .btn-login {
            background: linear-gradient(95deg, #1e3d1a, #3e8035);
            border: none;
            border-radius: 60px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: 0.2s;
            color: white;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30,61,26,0.2);
            background: linear-gradient(95deg, #2b5527, #4a9e42);
        }
        .back-link {
            color: #6c8b6c;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #1e3d1a;
        }
        .alert {
            border-radius: 60px;
            font-size: 0.85rem;
            text-align: center;
        }
        .divider {
            display: flex;
            align-items: center;
            color: #bcd0b0;
            font-size: 0.75rem;
            margin: 1rem 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: #e0efdc;
        }
        .divider-text {
            padding: 0 0.8rem;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #5c7a5a;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-chalkboard-teacher"></i>
            <h3>Portal Ustadz</h3>
            <p>Masuk untuk menjawab pertanyaan jemaah</p>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i> {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}
            <form method="POST">
                <div class="form-floating">
                    <input type="email" name="email" class="form-control" id="emailInput" placeholder=" " required autofocus>
                    <label for="emailInput"><i class="fas fa-envelope me-2"></i>Alamat Email</label>
                </div>
                <div class="form-floating">
                    <input type="password" name="password" class="form-control" id="passInput" placeholder=" " required>
                    <label for="passInput"><i class="fas fa-lock me-2"></i>Kata Sandi</label>
                </div>
                <button type="submit" class="btn btn-login mt-2"><i class="fas fa-sign-in-alt me-2"></i> Masuk Dashboard</button>
            </form>
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">atau</div>
                <div class="divider-line"></div>
            </div>
            <div class="text-center">
                <a href="/" class="back-link"><i class="fas fa-home me-1"></i> Kembali ke Beranda Utama</a>
            </div>
        </div>
        <footer>
            <i class="fas fa-mosque me-1"></i> Ruang Jemaah — E-Counseling Islami
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
