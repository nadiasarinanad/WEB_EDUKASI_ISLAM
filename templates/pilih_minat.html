<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Minat - Ruang Jemaah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .header-title {
            font-weight: 700;
            color: #1e3d1a;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .header-subtitle {
            color: #555;
            font-size: 1rem;
            line-height: 1.6;
        }

        .minat-checkbox {
            display: none;
        }

        .minat-card {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .minat-card i {
            font-size: 3rem;
            color: #2d5a27;
            transition: all 0.3s ease;
        }

        .minat-card h5 {
            font-weight: 600;
            color: #333;
            font-size: 1.2rem;
            margin: 0;
        }

        .minat-card p {
            font-size: 0.85rem;
            color: #777;
            margin: 0;
        }

        .minat-card:hover {
            border-color: #2d5a27;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(45, 90, 39, 0.1);
        }

        .minat-checkbox:checked + .minat-card {
            background: linear-gradient(135deg, #1e3d1a 0%, #3e8035 100%);
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(45, 90, 39, 0.3);
            transform: translateY(-5px);
        }

        .minat-checkbox:checked + .minat-card i,
        .minat-checkbox:checked + .minat-card h5,
        .minat-checkbox:checked + .minat-card p {
            color: white;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #1e3d1a 0%, #3e8035 100%);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 50px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(45, 90, 39, 0.3);
            margin-top: 40px;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 90, 39, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section mx-auto">
            <h1 class="header-title">Ahlan Wa Sahlan!</h1>
            <p class="header-subtitle">Untuk memberikan rekomendasi materi yang paling sesuai dengan kebutuhanmu, silakan pilih topik edukasi Islam yang ingin kamu pelajari hari ini.</p>
        </div>

        <form action="/pilih_minat" method="POST">
            <div class="row g-4 justify-content-center max-w-800 mx-auto" style="max-width: 900px;">
                
                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="checkbox" name="minat" value="1" class="minat-checkbox">
                        <div class="minat-card">
                            <i class="fas fa-kaaba"></i>
                            <div>
                                <h5>Fikih</h5>
                                <p>Thaharah, Shalat, Puasa</p>
                            </div>
                        </div>
                    </label>
                </div>

                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="checkbox" name="minat" value="2" class="minat-checkbox">
                        <div class="minat-card">
                            <i class="fas fa-heart"></i>
                            <div>
                                <h5>Akidah Akhlak</h5>
                                <p>Rukun Iman & Konsep Tauhid</p>
                            </div>
                        </div>
                    </label>
                </div>

                <div class="col-12 col-md-4">
                    <label class="w-100 h-100">
                        <input type="checkbox" name="minat" value="3" class="minat-checkbox">
                        <div class="minat-card">
                            <i class="fas fa-book-open"></i>
                            <div>
                                <h5>Sejarah (SKI)</h5>
                                <p>Sirah Nabawiyah & Khulafaur Rasyidin</p>
                            </div>
                        </div>
                    </label>
                </div>

            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-gradient">Lanjutkan ke Beranda <i class="fas fa-arrow-right ms-2"></i></button>
            </div>
        </form>
    </div>

</body>
</html>
