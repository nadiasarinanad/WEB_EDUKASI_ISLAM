<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Ruang Jemaah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .split-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden; 
            max-width: 900px;
            width: 100%;
        }
        /* INI GAMBAR BARU DARI PINTEREST */
        .image-side {
            background-image: url("https://i.pinimg.com/736x/9b/e1/af/9be1af92e33110b6e0b387c7f1f6960e.jpg");
            background-size: cover;
            background-position: center;
            min-height: 600px;
        }
        .form-side {
            padding: 50px 60px;
        }
        .form-title {
            font-weight: 700;
            color: #1e3d1a;
            margin-bottom: 30px;
            text-align: center;
        }
        .custom-input-group {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        .custom-input-group:focus-within {
            border-bottom: 2px solid #2d5a27;
        }
        .custom-input-group i {
            color: #888;
            padding: 10px;
            font-size: 1.1rem;
        }
        .custom-input-group input {
            border: none;
            outline: none;
            width: 100%;
            padding: 10px 10px 10px 5px;
            font-size: 0.95rem;
            color: #333;
            background: transparent;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #1e3d1a 0%, #3e8035 100%);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(45, 90, 39, 0.3);
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 90, 39, 0.4);
            color: white;
        }
        .social-btn {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 8px 30px; 
            color: #555;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }
        .social-btn:hover { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container px-4">
        <div class="row split-card mx-auto">
            <div class="col-md-5 image-side d-none d-md-block"></div>
            <div class="col-md-7 form-side p-3 p-md-5">
                <h2 class="form-title">Daftar Akun</h2>
                <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
                <form action="/register" method="POST">
                    <div class="custom-input-group">
                        <i class="far fa-user"></i>
                        <input type="text" name="nama" placeholder="Nama Lengkap" required>
                    </div>
                    <div class="custom-input-group">
                        <i class="far fa-envelope"></i>
                        <input type="email" name="email" placeholder="Email atau Nomor Telepon" required>
                    </div>
                    <div class="custom-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="passwordInputDaftar" placeholder="Password" required>
                        <i class="far fa-eye-slash" id="togglePasswordDaftar" style="cursor: pointer;"></i>
                    </div>
                    <div class="form-check mb-4 mt-3">
                        <input class="form-check-input" type="checkbox" id="terms" required style="accent-color: #2d5a27;">
                        <label class="form-check-label text-muted" for="terms" style="font-size: 0.85rem;">
                            Saya setuju dengan syarat dan ketentuan dari Web Edukasi Islam.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100">Daftar Sekarang</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted" style="font-size: 0.85rem;">Atau daftar menggunakan</p>
                    <div class="d-flex justify-content-center mb-4">
                        <a href="{{ url_for('google.login') }}" class="btn btn-outline-dark w-100 rounded-pill py-2">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" class="me-2">
    Lanjutkan dengan Google
</a>
                    </div>
                    <p class="text-muted" style="font-size: 0.9rem;">
                        Sudah punya akun? <a href="/login" style="color: #2d5a27; font-weight: 600; text-decoration: none;">Masuk di sini</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const togglePasswordDaftar = document.querySelector('#togglePasswordDaftar');
        const passwordDaftar = document.querySelector('#passwordInputDaftar');
        togglePasswordDaftar.addEventListener('click', function (e) {
            const type = passwordDaftar.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordDaftar.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
