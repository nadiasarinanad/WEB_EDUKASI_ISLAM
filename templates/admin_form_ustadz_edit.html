<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Ustadz - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Poppins', sans-serif; }
        .form-card { background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; max-width: 600px; margin: 50px auto; }
        .btn-submit { background: #2d5a27; border: none; border-radius: 50px; padding: 10px 25px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h3 class="mb-4"><i class="fas fa-user-edit text-success me-2"></i> Edit Ustadz</h3>
            <form method="POST">
                <div class="mb-3">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama_ustadz" class="form-control" value="{{ ustadz.nama_ustadz }}" required>
                </div>
                <div class="mb-3">
                    <label>Spesialisasi</label>
                    <input type="text" name="spesialisasi" class="form-control" value="{{ ustadz.spesialisasi }}" required>
                </div>
                <div class="mb-3">
                    <label>Pendidikan</label>
                    <input type="text" name="pendidikan" class="form-control" value="{{ ustadz.pendidikan }}">
                </div>
                <div class="mb-3">
                    <label>Bio</label>
                    <textarea name="bio" class="form-control" rows="3">{{ ustadz.bio }}</textarea>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" value="{{ ustadz.email }}" required>
                </div>
                <div class="mb-3">
                    <label>Password Baru (kosongkan jika tidak diubah)</label>
                    <input type="password" name="password" class="form-control" placeholder="Isi hanya jika ingin mengganti password">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/admin/dashboard" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-submit text-white">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
